runConfig:
  runtime: nodejs22
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 1

env:
  # Node's default 512 KiB body limit is below the handoff's 1 MiB limit and the
  # assistant share's 64 MiB limit. Leave room for each endpoint to count bytes
  # and return its own 413; both reject oversize bodies before parsing.
  - variable: BODY_SIZE_LIMIT
    value: 68M
    availability:
      - RUNTIME
  # Disabled in this fork: depends on the upstream maintainers' bucket.
  - variable: HANDOFF_UPLOADS_ENABLED
    value: "false"
    availability:
      - RUNTIME
  # Disabled in this fork: depends on the upstream maintainers' bucket.
  - variable: ASSISTANT_SHARES_ENABLED
    value: "false"
    availability:
      - RUNTIME
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
      - BUILD
  # Install the compiler/tooling without compiling a development-mode application.
  - variable: NPM_CONFIG_INCLUDE
    value: dev
    availability:
      - BUILD
  # Fill these from the Firebase console (Project settings > Your apps). They are public web config, not secrets.
  - variable: PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD1GdvoXM9TpNmXN1mL8TE1Q4T8uAXHy1Q
    availability:
      - BUILD
      - RUNTIME
  - variable: PUBLIC_FIREBASE_AUTH_DOMAIN
    value: openplan3d-db739.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: PUBLIC_FIREBASE_PROJECT_ID
    value: openplan3d-db739
    availability:
      - BUILD
      - RUNTIME
  - variable: PUBLIC_FIREBASE_STORAGE_BUCKET
    value: openplan3d-db739.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "31650172995"
    availability:
      - BUILD
      - RUNTIME
  - variable: PUBLIC_FIREBASE_APP_ID
    value: "1:31650172995:web:fc569966fb8d68e28084f6"
    availability:
      - BUILD
      - RUNTIME
